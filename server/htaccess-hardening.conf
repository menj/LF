# Langgam Fikir - .htaccess hardening (Apache / LiteSpeed)
#
# NOT part of the theme runtime. Copy this block into public_html/.htaccess
# ABOVE the "# BEGIN WordPress" block, then test:
#   /, /wp-admin/, a post, /.well-known/ (should still work), /.env (should be 410).
# Back up the existing .htaccess first; a syntax error causes a 500 site-wide.
#
# If the site is behind Cloudflare, the "Require not ip" rules see Cloudflare
# IPs unless mod_remoteip is set up - block those IPs in Cloudflare instead.

# ---- Block scanner / exploit probes (410 Gone, WordPress never loads) ----
<IfModule mod_rewrite.c>
RewriteEngine On

# Dotfiles & secrets (keep /.well-known/ for SSL renewals)
RewriteRule ^\.well-known/ - [L]
RewriteRule (^|/)\.(env|git|svn|htpasswd|DS_Store|aws|ssh) - [R=410,L]
RewriteRule \.(env|bak|backup|sql|old|orig|swp|zip|tar|gz|log)$ - [R=410,L]

# phpinfo / test files / webshell names seen in the Nov 2026 logs
RewriteRule (^|/)(phpinfo|info|test|wp-avac|wp-optimizer|rich|vvb|swm|this_is_a_new_hello_world|wp_filemanager)\.php$ - [R=410,L]

# PHP-CGI exploit paths and apps this site does not run
RewriteRule ^(cgi-bin|php-cgi|graphql|v1/graphql|swagger|webhooks|userfiles|autodiscover|webmail|smtp)(/|$) - [R=410,L]

# Fake WordPress sub-folders (/wp/xmlrpc.php, /blog/xmlrpc.php ...)
RewriteRule ^(wp|wordpress|blog|site|new)/ - [R=410,L]
</IfModule>

# ---- XML-RPC off (remove if you use Jetpack or the WordPress mobile app) ----
<Files xmlrpc.php>
  Require all denied
</Files>

# ---- REST batch endpoint & author enumeration ----
<IfModule mod_rewrite.c>
RewriteCond %{QUERY_STRING} (^|&)author=\d+ [NC]
RewriteRule ^ - [R=403,L]
RewriteRule ^wp-json/batch/ - [R=403,L]
</IfModule>

# ---- Abusive IPs / ranges from the Nov 2026 logs ----
<RequireAll>
  Require all granted
  Require not ip 91.92.47.0/24
  Require not ip 34.78.55.56
  Require not ip 4.197.158.170
  Require not ip 172.176.125.150
  Require not ip 172.196.48.135
  Require not ip 150.251.225.0/24
  Require not ip 20.87.218.237
  Require not ip 20.87.214.225
</RequireAll>

# ---- Aggressive bots (those that ignore robots.txt) ----
<IfModule mod_rewrite.c>
RewriteCond %{HTTP_USER_AGENT} (Bytespider|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot) [NC]
RewriteRule ^ - [F,L]
</IfModule>
